[project]
name = "hqteam"
version = "0.1.0"
description = "HQTeam AI company OS: 7 role agents, orchestration, approvals, RAG"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "anthropic>=1.0",
  "httpx>=0.27",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]
postgres = ["psycopg[binary]>=3.1"]
s3 = ["boto3>=1.34"]
vector = ["chromadb>=0.5"]

[project.scripts]
hqteam = "app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "db*", "scenarios*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
# агенты рендерят Markdown/SQL-шаблоны артефактов: длинные строки — содержимое документов
"app/agents/*.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
plugins = []
