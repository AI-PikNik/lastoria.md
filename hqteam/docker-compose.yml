# Локальный стек: API + PostgreSQL. Секреты — из .env (не коммитится).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: hqteam
      POSTGRES_USER: hqteam
      POSTGRES_PASSWORD: ${HQ_DB_PASSWORD:?задайте HQ_DB_PASSWORD в .env}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hqteam"]
      interval: 5s
  api:
    build: .
    env_file: .env
    environment:
      HQ_DATABASE_URL: postgresql+psycopg://hqteam:${HQ_DB_PASSWORD}@db:5432/hqteam
    depends_on: {db: {condition: service_healthy}}
    ports: ["8000:8000"]
    volumes: ["artifacts:/app/artifacts", "outbox:/app/outbox"]
volumes:
  pgdata: {}
  artifacts: {}
  outbox: {}
